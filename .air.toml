# Air configuration for Kestrix development
# Docs: https://github.com/air-verse/air

root = "."
tmp_dir = ".air"

[build]
  # Binary to run
  # The checkout is bind-mounted in Docker and may be owned by a different
  # host user; VCS stamping would make the build fail on Git safety checks.
  cmd = "go build -buildvcs=false -o .air/kestrix ./cmd/kestrix"
  # Binary path
  bin = ".air/kestrix"
  # Watch these directories
  include_ext = ["go", "tf"]
  # Exclude these directories
  exclude_dir = ["bin", "docs", "coverage", ".air", "vendor", ".git", "ui/node_modules"]
  # Delay after file change (ms)
  delay = 1000

[log]
  # Log time
  time = true

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[misc]
  # Delete temp directory on exit
  clean_on_exit = true
