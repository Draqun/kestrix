basePath: /
definitions:
  model.ExecuteSpec:
    properties:
      image:
        description: |-
          Image is the container image to pull for this job (per-job dynamic image).
          If empty, the project-level default image is used.
        type: string
      repo:
        description: |-
          Repo is the name of the ci_repo whose scripts should be executed.
          This is a reference, not an inline definition. It must resolve to a Repo
          declared in the same project.
        type: string
      script:
        description: Script is the command to run inside the repo's working directory.
        type: string
    type: object
  model.Project:
    properties:
      defaultImage:
        description: |-
          DefaultImage is the fallback container image for tasks without an explicit
          image.
        type: string
      name:
        description: 'Name is the HCL label: project "system-bankowy" { ... }'
        type: string
      repos:
        description: Repos is the set of repositories tracked by this project.
        items:
          $ref: '#/definitions/model.Repo'
        type: array
      tasks:
        description: Tasks is the set of tasks that form the pipeline.
        items:
          $ref: '#/definitions/model.Task'
        type: array
      variables:
        description: Variables declared at project level, with scoped visibility.
        items:
          $ref: '#/definitions/model.Variable'
        type: array
    type: object
  model.Repo:
    properties:
      kind:
        description: |-
          Kind indicates how this repo is resolved.
          "git"     — remote clone URL (multi-repo)
          "subpath" — local subdirectory within a monorepo workspace
        type: string
      name:
        description: |-
          Name is the local identifier used in trigger expressions, e.g. "auth_service".
          It corresponds to the HCL label: ci_repo "auth_service" { ... }
        type: string
      path:
        description: |-
          Path is the clone URL (multi-repo) or the subdirectory within a monorepo.
          Examples:
            multi-repo: "https://gitlab.com/org/auth.git"
            monorepo:   "src/auth"
        type: string
    type: object
  model.Task:
    properties:
      dependsOn:
        description: |-
          DependsOn lists tasks that must complete before this one starts.
          This is separate from the trigger — trigger decides *whether* to run,
          DependsOn decides *ordering* within the DAG.
        items:
          type: string
        type: array
      execute:
        $ref: '#/definitions/model.ExecuteSpec'
        description: Execute defines what to run and in which repo context.
      manual:
        description: |-
          Manual, when true, requires a human to click "Run" in the UI before the
          task executes, even if its trigger condition is met.
        type: boolean
      name:
        description: 'Name is the HCL label: ci_task "test_integration" { ... }'
        type: string
      trigger:
        description: |-
          Trigger is a boolean expression string evaluated by the DAG engine.
          Syntax examples:
            "repo.auth_service.changed && !repo.docs.changed"
            "repo.a.changed || repo.b.changed"
        type: string
    type: object
  model.Variable:
    properties:
      default:
        type: string
      env:
        description: environment filter
        type: string
      job:
        description: required if scope=job
        type: string
      key:
        type: string
      masked:
        type: boolean
      protected:
        type: boolean
      repo:
        description: required if scope=repo
        type: string
      scope:
        description: project, repo, job
        type: string
      value:
        type: string
    type: object
  store.ExtraRepo:
    properties:
      kind:
        description: '"subpath" or "git"'
        type: string
      name:
        type: string
      path:
        type: string
      url:
        type: string
    type: object
  store.PipelineSnapshot:
    properties:
      default_image:
        type: string
      name:
        type: string
      repos:
        items:
          $ref: '#/definitions/store.SnapshotRepo'
        type: array
      tasks:
        items:
          $ref: '#/definitions/store.SnapshotTask'
        type: array
      variables:
        items:
          $ref: '#/definitions/store.SnapshotVar'
        type: array
    type: object
  store.ProjectConfig:
    properties:
      created_at:
        type: string
      default_branch:
        type: string
      extra_repos:
        description: ExtraRepos lists additional repositories beyond the primary one.
        items:
          $ref: '#/definitions/store.ExtraRepo'
        type: array
      gitlab_project_id:
        type: integer
      name:
        type: string
      pipeline_dir:
        description: |-
          PipelineDir is relative to RepoPath and contains all .tf files that
          together define the pipeline.
        type: string
      pipeline_file:
        description: |-
          PipelineFile is the optional file opened by the editor. It is not used to
          select which definitions are executed; all .tf files in PipelineDir load.
        type: string
      repo_path:
        type: string
      repo_url:
        type: string
      webhook_secret:
        type: string
    type: object
  store.Run:
    properties:
      changed:
        items:
          type: string
        type: array
      error:
        type: string
      finished_at:
        type: string
      id:
        type: integer
      include_manual:
        type: boolean
      output:
        type: string
      pipeline_def:
        $ref: '#/definitions/store.PipelineSnapshot'
      project_name:
        type: string
      started_at:
        type: string
      status:
        description: running, passed, failed
        type: string
      task_results:
        items:
          $ref: '#/definitions/store.TaskResult'
        type: array
    type: object
  store.SnapshotExec:
    properties:
      image:
        type: string
      repo:
        type: string
      script:
        type: string
    type: object
  store.SnapshotRepo:
    properties:
      kind:
        type: string
      name:
        type: string
      path:
        type: string
    type: object
  store.SnapshotTask:
    properties:
      depends_on:
        items:
          type: string
        type: array
      execute:
        $ref: '#/definitions/store.SnapshotExec'
      manual:
        type: boolean
      name:
        type: string
      trigger:
        type: string
    type: object
  store.SnapshotVar:
    properties:
      default:
        type: string
      env:
        type: string
      job:
        type: string
      key:
        type: string
      masked:
        type: boolean
      protected:
        type: boolean
      repo:
        type: string
      scope:
        type: string
      value:
        type: string
    type: object
  store.TaskResult:
    properties:
      duration:
        type: integer
      error:
        type: string
      name:
        type: string
      output:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: damian.giebas@gmail.com
    name: Kestrix Team
  description: GitLab webhook secret token for signature verification
  title: Kestrix API
  version: 0.2.0
paths:
  /api/generate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Generation options
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Generate gitlab-ci.yml from pipeline definition
      tags:
      - pipeline
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - system
  /api/logs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Get webhook logs
      tags:
      - webhooks
  /api/pipeline:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Project'
      summary: Parse and return pipeline definition
      tags:
      - pipeline
  /api/pipeline/raw:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Return raw pipeline HCL source
      tags:
      - pipeline
  /api/projects:
    get:
      produces:
      - application/json
      parameters:
      - description: Items per page (10, 25, 50, 100; default 25)
        in: query
        name: limit
        required: false
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        required: false
        type: integer
      responses:
        "200":
          description: paginated project list
          schema:
            properties:
              items:
                items:
                  $ref: '#/definitions/store.ProjectConfig'
                type: array
              pagination:
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  next:
                    type: string
                    x-nullable: true
                  prev:
                    type: string
                    x-nullable: true
                type: object
            type: object
      summary: List configured projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/store.ProjectConfig'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.ProjectConfig'
      summary: Create a project (point at a repo and its pipeline definition directory)
      tags:
      - projects
  /api/projects/{name}:
    delete:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a project config
      tags:
      - projects
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ProjectConfig'
      summary: Get a project config
      tags:
      - projects
    put:
      consumes:
      - application/json
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Updated config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/store.ProjectConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ProjectConfig'
      summary: Update a project config
      tags:
      - projects
  /api/projects/{name}/pipeline:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get raw pipeline HCL for a project
      tags:
      - projects
    post:
      consumes:
      - text/plain
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Save the editor pipeline file inside a project's pipeline directory
      tags:
      - projects
  /api/projects/{name}/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Changed repos
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Resolve a project's triggers against changed repos
      tags:
      - projects
  /api/projects/{name}/runs:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Items per page (10, 25, 50, 100; default 25)
        in: query
        name: limit
        required: false
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: paginated run list
          schema:
            properties:
              items:
                items:
                  $ref: '#/definitions/store.Run'
                type: array
              pagination:
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  next:
                    type: string
                    x-nullable: true
                  prev:
                    type: string
                    x-nullable: true
                type: object
            type: object
      summary: List pipeline runs for a project
      tags:
      - runs
  /api/projects/{name}/runs/{runID}:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Run ID
        in: path
        name: runID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Run'
      summary: Get a pipeline run by ID
      tags:
      - runs
  /api/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Changed repos
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Resolve trigger expressions against changed repos
      tags:
      - pipeline
  /api/runs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Run'
            type: array
      summary: List all pipeline runs across projects
      tags:
      - runs
  /api/validate:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Validate pipeline definition
      tags:
      - pipeline
  /webhook:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Receive GitLab webhook
      tags:
      - webhooks
securityDefinitions:
  WebhookToken:
    in: header
    name: X-Gitlab-Token
    type: apiKey
swagger: "2.0"
