basePath: /
definitions:
  domain.AcquiredSource:
    properties:
      credential_ref:
        type: string
      primary:
        type: boolean
      repo_name:
        type: string
      requested_ref:
        type: string
      resolved_revision:
        type: string
      url:
        type: string
    type: object
  domain.ExecuteSpec:
    properties:
      image:
        type: string
      repo:
        type: string
      script:
        type: string
    type: object
  domain.Project:
    properties:
      default_image:
        type: string
      name:
        type: string
      repos:
        items:
          $ref: '#/definitions/domain.Repo'
        type: array
      tasks:
        items:
          $ref: '#/definitions/domain.Task'
        type: array
      variables:
        items:
          $ref: '#/definitions/domain.Variable'
        type: array
    type: object
  domain.ProjectConfig:
    properties:
      created_at:
        type: string
      default_branch:
        type: string
      gitlab_project_id:
        type: integer
      has_webhook_secret:
        description: |-
          HasWebhookSecret reports whether a webhook secret is stored, without
          disclosing it. Only publicProject sets this on an outgoing copy; the
          stored struct itself does not populate it.
        type: boolean
      name:
        type: string
      pipeline_dir:
        type: string
      pipeline_file:
        type: string
      repo_credential_ref:
        type: string
      repo_ref:
        type: string
      repo_url:
        type: string
      sources:
        description: Sources is derived and read-only; a client-supplied value is
          ignored.
        items:
          $ref: '#/definitions/domain.ProjectSource'
        type: array
      webhook_secret:
        description: |-
          WebhookSecret is write-only: it is accepted on create and update but
          SHALL NOT appear in any response - see webhook-ingress-hardening D4.
          Responses carry HasWebhookSecret instead; callers encoding a
          ProjectConfig for the wire MUST go through the web package's
          publicProject helper first.
        type: string
    type: object
  domain.ProjectGrant:
    properties:
      project_name:
        type: string
      role:
        type: string
      user_name:
        type: string
    type: object
  domain.ProjectSource:
    properties:
      name:
        type: string
      primary:
        type: boolean
      url:
        type: string
    type: object
  domain.Repo:
    properties:
      credential_ref:
        type: string
      kind:
        type: string
      name:
        type: string
      path:
        type: string
      ref:
        type: string
      url:
        type: string
    type: object
  domain.Task:
    properties:
      depends_on:
        items:
          type: string
        type: array
      execute:
        $ref: '#/definitions/domain.ExecuteSpec'
      manual:
        type: boolean
      name:
        type: string
      trigger:
        type: string
    type: object
  domain.TaskResult:
    properties:
      approved_at:
        description: |-
          ApprovedAt is when ApprovedBy approved the task. nil for a task never
          approved.
        type: string
      approved_by:
        description: |-
          ApprovedBy is the actor that approved this manual task, "user:<name>".
          Empty for a task never approved - see run-attribution D4.
        type: string
      duration:
        type: integer
      error:
        type: string
      name:
        type: string
      output:
        type: string
      status:
        description: passed, failed, skipped, running, pending, manual
        type: string
    type: object
  domain.Variable:
    properties:
      default:
        type: string
      env:
        type: string
      job:
        type: string
      key:
        type: string
      masked:
        type: boolean
      protected:
        type: boolean
      repo:
        type: string
      scope:
        type: string
      secret_ref:
        description: |-
          SecretRef names a `secret` credential to resolve at run start and
          inject as this variable's value; see runtime-secrets. Mutually
          exclusive with Value and Default, and always masked.
        type: string
      value:
        type: string
    type: object
  model.Project:
    properties:
      default_image:
        type: string
      name:
        type: string
      repos:
        items:
          $ref: '#/definitions/domain.Repo'
        type: array
      tasks:
        items:
          $ref: '#/definitions/domain.Task'
        type: array
      variables:
        items:
          $ref: '#/definitions/domain.Variable'
        type: array
    type: object
  store.Run:
    properties:
      canceled_by:
        description: |-
          CanceledBy is the actor that canceled the run. Empty unless the run
          was canceled while running or queued - see run-attribution D3 and
          run-concurrency-and-retention design.md D2.
        type: string
      changed:
        items:
          type: string
        type: array
      error:
        type: string
      finished_at:
        type: string
      id:
        type: integer
      include_manual:
        type: boolean
      output:
        type: string
      pipeline_def:
        $ref: '#/definitions/domain.Project'
      project_name:
        type: string
      sources:
        items:
          $ref: '#/definitions/domain.AcquiredSource'
        type: array
      started_at:
        type: string
      started_by:
        description: |-
          StartedBy is the actor that started the run, "user:<name>". Empty for
          a run recorded before run-attribution existed.
        type: string
      status:
        type: string
      task_results:
        items:
          $ref: '#/definitions/domain.TaskResult'
        type: array
    type: object
  web.createUserRequest:
    properties:
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  web.loginRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  web.loginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  web.meResponse:
    properties:
      expires_at:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  web.setGrantsRequest:
    properties:
      grants:
        items:
          properties:
            project_name:
              type: string
            role:
              type: string
          type: object
        type: array
    type: object
  web.setupRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  web.setupStatusResponse:
    properties:
      required:
        type: boolean
    type: object
  web.updateUserRoleRequest:
    properties:
      role:
        type: string
    type: object
  web.userView:
    properties:
      created_at:
        type: string
      grants:
        items:
          $ref: '#/definitions/domain.ProjectGrant'
        type: array
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: damian.giebas@gmail.com
    name: Kestrix Team
  description: GitLab webhook secret token for signature verification
  title: Kestrix API
  version: 0.2.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.loginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate and obtain a token
      tags:
      - auth
  /api/auth/logout:
    post:
      responses:
        "204":
          description: ""
      summary: End the browser session
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.meResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Current session
      tags:
      - auth
  /api/dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Dashboard metrics
      tags:
      - system
  /api/generate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Generation options
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Generate gitlab-ci.yml from pipeline definition
      tags:
      - pipeline
  /api/health:
    get:
      description: |-
        Returns 503 when a backing store query fails; the body then
        carries "status": "degraded" and omits the failed counter.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - system
  /api/logs:
    get:
      description: Returns recorded webhook events newest first, in the standard paginated
        envelope.
      parameters:
      - description: Maximum events to return
        in: query
        name: limit
        type: integer
      - description: Number of events to skip
        in: query
        name: offset
        type: integer
      - description: Filter by registered project name
        in: query
        name: project
        type: string
      - description: Filter by status
        enum:
        - triggered
        - skipped
        - ignored
        - error
        in: query
        name: status
        type: string
      - description: Only events received at or after this RFC3339 timestamp
        in: query
        name: since
        type: string
      - description: Only events received at or before this RFC3339 timestamp
        in: query
        name: until
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List webhook history
      tags:
      - webhooks
  /api/pipeline:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Project'
      summary: Parse and return pipeline definition
      tags:
      - pipeline
  /api/pipeline/raw:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Return raw pipeline HCL source
      tags:
      - pipeline
  /api/projects:
    get:
      parameters:
      - description: Items per page (10, 25, 50, 100; default 25)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: paginated project list
          schema:
            additionalProperties: true
            type: object
      summary: List configured projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ProjectConfig'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.ProjectConfig'
      summary: Create a project (point at a repo and its pipeline definition directory)
      tags:
      - projects
  /api/projects/{name}:
    delete:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Delete a project config
      tags:
      - projects
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ProjectConfig'
      summary: Get a project config
      tags:
      - projects
    put:
      consumes:
      - application/json
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Updated config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ProjectConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ProjectConfig'
      summary: Update a project config
      tags:
      - projects
  /api/projects/{name}/pipeline:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get raw pipeline HCL for a project
      tags:
      - projects
    post:
      consumes:
      - text/plain
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "405":
          description: Method Not Allowed
          schema:
            additionalProperties: true
            type: object
      summary: Reject writes to Git-owned registered pipeline content
      tags:
      - projects
  /api/projects/{name}/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Changed repos
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Resolve a project's triggers against changed repos
      tags:
      - projects
  /api/projects/{name}/runs:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Items per page (10, 25, 50, 100; default 25)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: paginated run list
          schema:
            additionalProperties: true
            type: object
      summary: List pipeline runs for a project
      tags:
      - runs
  /api/projects/{name}/runs/{runID}:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Run ID
        in: path
        name: runID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Run'
      summary: Get a pipeline run by ID
      tags:
      - runs
  /api/projects/{name}/tasks/{task}/run:
    post:
      description: Accepts the run and returns at once; the task executes in the background.
        Read the outcome from GET /api/projects/{name}/runs/{runID}.
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Task name
        in: path
        name: task
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: run_id, project, task, and accepted status (running or queued)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start a run containing a single task
      tags:
      - runs
  /api/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Changed repos
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Resolve trigger expressions against changed repos
      tags:
      - pipeline
  /api/runs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Run'
            type: array
      summary: List all pipeline runs across projects
      tags:
      - runs
  /api/setup:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.setupStatusResponse'
      summary: Report whether first-run setup is required
      tags:
      - setup
    post:
      consumes:
      - application/json
      parameters:
      - description: First administrator
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.setupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/web.userView'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create the first administrator account
      tags:
      - setup
  /api/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List accounts
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: New account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/web.userView'
      summary: Create an account
      tags:
      - users
  /api/users/{user}:
    delete:
      parameters:
      - description: Account name
        in: path
        name: user
        required: true
        type: string
      responses:
        "204":
          description: ""
      summary: Delete an account
      tags:
      - users
  /api/users/{user}/grants:
    put:
      consumes:
      - application/json
      parameters:
      - description: Account name
        in: path
        name: user
        required: true
        type: string
      - description: Desired grants
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.setGrantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.userView'
      summary: Replace an account's project grants
      tags:
      - users
  /api/users/{user}/role:
    put:
      consumes:
      - application/json
      parameters:
      - description: Account name
        in: path
        name: user
        required: true
        type: string
      - description: New role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.updateUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.userView'
      summary: Change an account's global role
      tags:
      - users
  /api/validate:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Validate pipeline definition
      tags:
      - pipeline
  /webhook:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Receive GitLab webhook
      tags:
      - webhooks
securityDefinitions:
  WebhookToken:
    in: header
    name: X-Gitlab-Token
    type: apiKey
swagger: "2.0"
