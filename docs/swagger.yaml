basePath: /
definitions:
  domain.AcquiredSource:
    properties:
      credential_ref:
        type: string
      primary:
        type: boolean
      repo_name:
        type: string
      requested_ref:
        type: string
      resolved_revision:
        type: string
      url:
        type: string
    type: object
  domain.ExecuteSpec:
    properties:
      image:
        type: string
      repo:
        type: string
      script:
        type: string
    type: object
  domain.Project:
    properties:
      default_image:
        type: string
      name:
        type: string
      repos:
        items:
          $ref: '#/definitions/domain.Repo'
        type: array
      tasks:
        items:
          $ref: '#/definitions/domain.Task'
        type: array
      variables:
        items:
          $ref: '#/definitions/domain.Variable'
        type: array
    type: object
  domain.ProjectConfig:
    properties:
      created_at:
        type: string
      default_branch:
        type: string
      gitlab_project_id:
        type: integer
      name:
        type: string
      pipeline_dir:
        type: string
      pipeline_file:
        type: string
      repo_credential_ref:
        type: string
      repo_ref:
        type: string
      repo_url:
        type: string
      webhook_secret:
        type: string
    type: object
  domain.Repo:
    properties:
      credential_ref:
        type: string
      kind:
        type: string
      name:
        type: string
      path:
        type: string
      ref:
        type: string
      url:
        type: string
    type: object
  domain.Task:
    properties:
      depends_on:
        items:
          type: string
        type: array
      execute:
        $ref: '#/definitions/domain.ExecuteSpec'
      manual:
        type: boolean
      name:
        type: string
      trigger:
        type: string
    type: object
  domain.TaskResult:
    properties:
      duration:
        type: integer
      error:
        type: string
      name:
        type: string
      output:
        type: string
      status:
        description: passed, failed, skipped, running, pending, manual
        type: string
    type: object
  domain.Variable:
    properties:
      default:
        type: string
      env:
        type: string
      job:
        type: string
      key:
        type: string
      masked:
        type: boolean
      protected:
        type: boolean
      repo:
        type: string
      scope:
        type: string
      value:
        type: string
    type: object
  model.Project:
    properties:
      default_image:
        type: string
      name:
        type: string
      repos:
        items:
          $ref: '#/definitions/domain.Repo'
        type: array
      tasks:
        items:
          $ref: '#/definitions/domain.Task'
        type: array
      variables:
        items:
          $ref: '#/definitions/domain.Variable'
        type: array
    type: object
  store.Run:
    properties:
      changed:
        items:
          type: string
        type: array
      error:
        type: string
      finished_at:
        type: string
      id:
        type: integer
      include_manual:
        type: boolean
      output:
        type: string
      pipeline_def:
        $ref: '#/definitions/domain.Project'
      project_name:
        type: string
      sources:
        items:
          $ref: '#/definitions/domain.AcquiredSource'
        type: array
      started_at:
        type: string
      status:
        type: string
      task_results:
        items:
          $ref: '#/definitions/domain.TaskResult'
        type: array
    type: object
host: localhost:8080
info:
  contact:
    email: damian.giebas@gmail.com
    name: Kestrix Team
  description: GitLab webhook secret token for signature verification
  title: Kestrix API
  version: 0.2.0
paths:
  /api/dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Dashboard metrics
      tags:
      - system
  /api/generate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Generation options
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Generate gitlab-ci.yml from pipeline definition
      tags:
      - pipeline
  /api/health:
    get:
      description: |-
        Returns 503 when a backing store query fails; the body then
        carries "status": "degraded" and omits the failed counter.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - system
  /api/logs:
    get:
      description: Returns recorded webhook events newest first, in the standard paginated
        envelope.
      parameters:
      - description: Maximum events to return
        in: query
        name: limit
        type: integer
      - description: Number of events to skip
        in: query
        name: offset
        type: integer
      - description: Filter by registered project name
        in: query
        name: project
        type: string
      - description: Filter by status
        enum:
        - triggered
        - skipped
        - ignored
        - error
        in: query
        name: status
        type: string
      - description: Only events received at or after this RFC3339 timestamp
        in: query
        name: since
        type: string
      - description: Only events received at or before this RFC3339 timestamp
        in: query
        name: until
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List webhook history
      tags:
      - webhooks
  /api/pipeline:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Project'
      summary: Parse and return pipeline definition
      tags:
      - pipeline
  /api/pipeline/raw:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Return raw pipeline HCL source
      tags:
      - pipeline
  /api/projects:
    get:
      parameters:
      - description: Items per page (10, 25, 50, 100; default 25)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: paginated project list
          schema:
            additionalProperties: true
            type: object
      summary: List configured projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ProjectConfig'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.ProjectConfig'
      summary: Create a project (point at a repo and its pipeline definition directory)
      tags:
      - projects
  /api/projects/{name}:
    delete:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a project config
      tags:
      - projects
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ProjectConfig'
      summary: Get a project config
      tags:
      - projects
    put:
      consumes:
      - application/json
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Updated config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ProjectConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ProjectConfig'
      summary: Update a project config
      tags:
      - projects
  /api/projects/{name}/pipeline:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get raw pipeline HCL for a project
      tags:
      - projects
    post:
      consumes:
      - text/plain
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "405":
          description: Method Not Allowed
          schema:
            additionalProperties: true
            type: object
      summary: Reject writes to Git-owned registered pipeline content
      tags:
      - projects
  /api/projects/{name}/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Changed repos
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Resolve a project's triggers against changed repos
      tags:
      - projects
  /api/projects/{name}/runs:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Items per page (10, 25, 50, 100; default 25)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: paginated run list
          schema:
            additionalProperties: true
            type: object
      summary: List pipeline runs for a project
      tags:
      - runs
  /api/projects/{name}/runs/{runID}:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Run ID
        in: path
        name: runID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Run'
      summary: Get a pipeline run by ID
      tags:
      - runs
  /api/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Changed repos
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Resolve trigger expressions against changed repos
      tags:
      - pipeline
  /api/runs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Run'
            type: array
      summary: List all pipeline runs across projects
      tags:
      - runs
  /api/validate:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Validate pipeline definition
      tags:
      - pipeline
  /webhook:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Receive GitLab webhook
      tags:
      - webhooks
securityDefinitions:
  WebhookToken:
    in: header
    name: X-Gitlab-Token
    type: apiKey
swagger: "2.0"
