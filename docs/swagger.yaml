basePath: /
definitions:
  domain.AcquiredSource:
    properties:
      credential_ref:
        type: string
      primary:
        type: boolean
      repo_name:
        type: string
      requested_ref:
        type: string
      resolved_revision:
        type: string
      url:
        type: string
    type: object
  domain.CredentialInput:
    properties:
      host:
        type: string
      known_hosts:
        type: string
      name:
        type: string
      password:
        type: string
      private_key:
        type: string
      provider:
        type: string
      token:
        type: string
      type:
        type: string
      username:
        type: string
      value:
        description: |-
          Value is the opaque payload of a `secret` credential (see
          runtime-secrets). It is unused by every Git credential type.
        type: string
    type: object
  domain.CredentialMetadata:
    properties:
      created_at:
        type: string
      host:
        type: string
      name:
        type: string
      provider:
        type: string
      ref:
        type: string
      revoked:
        type: boolean
      type:
        type: string
      updated_at:
        type: string
    type: object
  domain.ExecuteSpec:
    properties:
      image:
        type: string
      repo:
        type: string
      script:
        type: string
    type: object
  domain.Project:
    properties:
      cancel_in_progress:
        type: boolean
      default_image:
        type: string
      name:
        type: string
      repos:
        items:
          $ref: '#/definitions/domain.Repo'
        type: array
      tasks:
        items:
          $ref: '#/definitions/domain.Task'
        type: array
      variables:
        items:
          $ref: '#/definitions/domain.Variable'
        type: array
    type: object
  domain.ProjectConfig:
    properties:
      created_at:
        type: string
      default_branch:
        type: string
      gitlab_project_id:
        type: integer
      has_webhook_secret:
        description: |-
          HasWebhookSecret reports whether a webhook secret is stored, without
          disclosing it. Only publicProject sets this on an outgoing copy; the
          stored struct itself does not populate it.
        type: boolean
      mode:
        description: |-
          Mode selects this project's execution backend: "local", "docker", or
          "remote" - see remote-runner-registration
          design.md D2. Empty on input defaults to the instance's configured
          mode (ProjectService.DefaultMode); always populated on output.
        type: string
      name:
        type: string
      pipeline_dir:
        type: string
      pipeline_file:
        type: string
      repo_credential_ref:
        type: string
      repo_ref:
        type: string
      repo_url:
        type: string
      sources:
        description: Sources is derived and read-only; a client-supplied value is
          ignored.
        items:
          $ref: '#/definitions/domain.ProjectSource'
        type: array
      webhook_secret:
        description: |-
          WebhookSecret is write-only: it is accepted on create and update but
          SHALL NOT appear in any response - see webhook-ingress-hardening D4.
          Responses carry HasWebhookSecret instead; callers encoding a
          ProjectConfig for the wire MUST go through the web package's
          publicProject helper first.
        type: string
    type: object
  domain.ProjectGrant:
    properties:
      project_name:
        type: string
      role:
        type: string
      user_name:
        type: string
    type: object
  domain.ProjectSource:
    properties:
      name:
        type: string
      primary:
        type: boolean
      url:
        type: string
    type: object
  domain.RemoteJob:
    properties:
      claim_epoch:
        type: integer
      claimed_at:
        type: string
      id:
        type: integer
      payload:
        $ref: '#/definitions/domain.RemoteJobPayload'
      run_id:
        type: integer
      runner_id:
        type: integer
      status:
        type: string
      task_name:
        type: string
      updated_at:
        type: string
    type: object
  domain.RemoteJobPayload:
    properties:
      archive:
        items:
          type: integer
        type: array
      artifacts:
        description: |-
          Artifacts carries the archives of every passed ancestor of the task,
          ordered topologically with ties broken by declaration order (remote-task-artifacts design D4).
        items:
          items:
            type: integer
          type: array
        type: array
      default_image:
        description: |-
          DefaultImage is the project's own default, for a docker-mode runner
          resolving an image when the task names none - the same fallback
          RunOne applies in-process. It is data already public in the pipeline
          definition, not an engine selector Kestrix is choosing on the
          runner's behalf (design.md D3): the runner's own configuration alone
          decides whether it runs docker or local at all.
        type: string
      repos:
        description: |-
          Repos carries the project's declared repositories - Name, Path, and
          Kind only (never URL/CredentialRef, which name a live source the
          runner never touches: D6 already shipped the checkout as Archive).
          The runner needs this to resolve task.Execute.Repo's working
          directory within the extracted archive the same way internal/runner's
          repoDir does in-process.
        items:
          $ref: '#/definitions/domain.Repo'
        type: array
      secret_values:
        description: |-
          SecretValues are the resolved runtime-secret values among Variables,
          so the runner can redact its own streamed output across chunk
          boundaries (remote-runner-fixes design.md D1). The runner already
          holds every value as a variable; this only says which ones to hide.
          Variables and SecretValues are stored encrypted; the store's payload
          column uses its own type that has neither field (D2).
        items:
          type: string
        type: array
      task:
        $ref: '#/definitions/domain.Task'
      variables:
        additionalProperties:
          type: string
        type: object
    type: object
  domain.Repo:
    properties:
      credential_ref:
        type: string
      kind:
        type: string
      name:
        type: string
      path:
        type: string
      ref:
        type: string
      url:
        type: string
    type: object
  domain.SkipReason:
    properties:
      category:
        enum:
        - trigger_unsatisfied
        - dependency_failed
        - dependency_canceled
        - run_canceled
        type: string
      failed_dependencies:
        items:
          type: string
        type: array
      summary:
        type: string
      trigger_evaluation:
        $ref: '#/definitions/domain.TriggerEvaluation'
    type: object
  domain.Task:
    properties:
      artifacts:
        description: |-
          Artifacts names paths relative to the task's working directory that
          the task produces for tasks depending on it (remote-task-artifacts).
        items:
          type: string
        type: array
      depends_on:
        items:
          type: string
        type: array
      execute:
        $ref: '#/definitions/domain.ExecuteSpec'
      manual:
        type: boolean
      name:
        type: string
      runner_tags:
        description: |-
          RunnerTags are the tags a runner must carry to execute this task in
          remote mode, normalised by NormalizeRunnerTags; ignored in every other
          mode (remote-runner-management).
        items:
          type: string
        type: array
      timeout:
        type: string
      trigger:
        type: string
    type: object
  domain.TaskResult:
    properties:
      approved_at:
        description: |-
          ApprovedAt is when ApprovedBy approved the task. nil for a task never
          approved.
        type: string
      approved_by:
        description: |-
          ApprovedBy is the actor that approved this manual task, "user:<name>".
          Empty for a task never approved - see run-attribution D4.
        type: string
      duration:
        type: integer
      error:
        type: string
      name:
        type: string
      output:
        type: string
      skip_reason:
        $ref: '#/definitions/domain.SkipReason'
        description: SkipReason explains why a task was skipped.
      status:
        description: passed, failed, skipped, running, pending, manual
        type: string
      waiting_reason:
        description: |-
          WaitingReason is set on the latest result of an unmatched pending task
          (remote-unmatched-job-alert design D2). Omitted when empty.
        type: string
    type: object
  domain.TriggerEvaluation:
    properties:
      changed_repos:
        items:
          type: string
        type: array
      expression:
        type: string
      satisfied:
        type: boolean
      terms:
        additionalProperties:
          type: boolean
        description: 'e.g. "repo.backend.changed": false'
        type: object
    type: object
  domain.Variable:
    properties:
      default:
        type: string
      env:
        type: string
      job:
        type: string
      key:
        type: string
      masked:
        type: boolean
      protected:
        type: boolean
      repo:
        type: string
      scope:
        type: string
      secret_ref:
        description: |-
          SecretRef names a `secret` credential to resolve at run start and
          inject as this variable's value; see runtime-secrets. Mutually
          exclusive with Value and Default, and always masked.
        type: string
      value:
        type: string
    type: object
  store.Run:
    properties:
      canceled_by:
        description: |-
          CanceledBy is the actor that canceled the run. Empty unless the run
          was canceled while running or queued - see run-attribution D3 and
          run-concurrency-and-retention design.md D2.
        type: string
      changed:
        items:
          type: string
        type: array
      error:
        type: string
      finished_at:
        type: string
      id:
        type: integer
      include_manual:
        type: boolean
      output:
        type: string
      pipeline_def:
        $ref: '#/definitions/domain.Project'
      project_name:
        type: string
      rerun_task:
        description: |-
          RerunTask is the task a single-task re-run was started for; empty for
          every other run, including runs stored before the field existed.
        type: string
      sources:
        items:
          $ref: '#/definitions/domain.AcquiredSource'
        type: array
      started_at:
        type: string
      started_by:
        description: |-
          StartedBy is the actor that started the run, "user:<name>". Empty for
          a run recorded before run-attribution existed.
        type: string
      status:
        type: string
      task_results:
        items:
          $ref: '#/definitions/domain.TaskResult'
        type: array
    type: object
  web.createUserRequest:
    properties:
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  web.loginRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  web.loginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  web.meResponse:
    properties:
      expires_at:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  web.runProjectRequest:
    properties:
      changed:
        items:
          type: string
        type: array
      include_manual:
        type: boolean
    type: object
  web.runnerCompleteRequest:
    properties:
      epoch:
        type: integer
      error:
        type: string
      output:
        type: string
      status:
        type: string
    type: object
  web.runnerCreateRequest:
    properties:
      name:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  web.runnerCreateResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      token:
        type: string
    type: object
  web.runnerTraceRequest:
    properties:
      chunk:
        type: string
      epoch:
        type: integer
      offset:
        type: integer
    type: object
  web.setGrantsRequest:
    properties:
      grants:
        items:
          properties:
            project_name:
              type: string
            role:
              type: string
          type: object
        type: array
    type: object
  web.setupRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  web.setupStatusResponse:
    properties:
      required:
        type: boolean
    type: object
  web.updateUserRoleRequest:
    properties:
      role:
        type: string
    type: object
  web.userView:
    properties:
      created_at:
        type: string
      grants:
        items:
          $ref: '#/definitions/domain.ProjectGrant'
        type: array
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: damian.giebas@gmail.com
    name: Kestrix Team
  description: GitLab webhook secret token for signature verification
  title: Kestrix API
  version: 0.8.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.loginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate and obtain a token
      tags:
      - auth
  /api/auth/logout:
    post:
      responses:
        "204":
          description: ""
      summary: End the browser session
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.meResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Current session
      tags:
      - auth
  /api/credentials:
    get:
      description: Returns metadata for all registered credentials without revealing
        secret values.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List stored credentials metadata
      tags:
      - credentials
    post:
      consumes:
      - application/json
      description: Encrypts and stores a new credential, returning its safe metadata.
      parameters:
      - description: Credential definition and secret material
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CredentialInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.CredentialMetadata'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a credential
      tags:
      - credentials
  /api/credentials/{ref}:
    get:
      description: Returns safe metadata for a credential by its reference without
        revealing secret values.
      parameters:
      - description: Credential reference
        in: path
        name: ref
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CredentialMetadata'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get credential metadata by ref
      tags:
      - credentials
    put:
      consumes:
      - application/json
      description: Updates the secret material of an existing credential.
      parameters:
      - description: Credential reference
        in: path
        name: ref
        required: true
        type: string
      - description: Updated credential secret material
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CredentialInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CredentialMetadata'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rotate credential secret material
      tags:
      - credentials
  /api/credentials/{ref}/revoke:
    post:
      description: Revokes a credential reference so it cannot be used for subsequent
        runs.
      parameters:
      - description: Credential reference
        in: path
        name: ref
        required: true
        type: string
      responses:
        "204":
          description: Credential revoked
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Revoke a credential
      tags:
      - credentials
  /api/dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Dashboard metrics
      tags:
      - system
  /api/generate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Generation options
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Generate gitlab-ci.yml from pipeline definition
      tags:
      - pipeline
  /api/health:
    get:
      description: |-
        Returns 503 when a backing store query fails; the body then
        carries "status": "degraded" and omits the failed counter.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - system
  /api/logs:
    get:
      description: Returns recorded webhook events newest first, in the standard paginated
        envelope.
      parameters:
      - description: Maximum events to return
        in: query
        name: limit
        type: integer
      - description: Number of events to skip
        in: query
        name: offset
        type: integer
      - description: Filter by registered project name
        in: query
        name: project
        type: string
      - description: Filter by status
        enum:
        - triggered
        - skipped
        - ignored
        - error
        in: query
        name: status
        type: string
      - description: Only events received at or after this RFC3339 timestamp
        in: query
        name: since
        type: string
      - description: Only events received at or before this RFC3339 timestamp
        in: query
        name: until
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List webhook history
      tags:
      - webhooks
  /api/pipeline:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Project'
      summary: Parse and return pipeline definition
      tags:
      - pipeline
  /api/pipeline/raw:
    get:
      parameters:
      - description: Pipeline directory
        in: query
        name: dir
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Return raw pipeline HCL source
      tags:
      - pipeline
  /api/projects:
    get:
      parameters:
      - description: Items per page (10, 25, 50, 100; default 25)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: paginated project list
          schema:
            additionalProperties: true
            type: object
      summary: List configured projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ProjectConfig'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.ProjectConfig'
      summary: Create a project (point at a repo and its pipeline definition directory)
      tags:
      - projects
  /api/projects/{name}:
    delete:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Delete a project config
      tags:
      - projects
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ProjectConfig'
      summary: Get a project config
      tags:
      - projects
    put:
      consumes:
      - application/json
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Updated config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ProjectConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ProjectConfig'
      summary: Update a project config
      tags:
      - projects
  /api/projects/{name}/definition:
    get:
      description: Returns the parsed configured pipeline file including repos and
        tasks.
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Project'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get parsed pipeline definition for a project
      tags:
      - projects
  /api/projects/{name}/pipeline:
    get:
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get raw pipeline HCL for a project
      tags:
      - projects
    post:
      consumes:
      - text/plain
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "405":
          description: Method Not Allowed
          schema:
            additionalProperties: true
            type: object
      summary: Reject writes to Git-owned registered pipeline content
      tags:
      - projects
  /api/projects/{name}/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Changed repos
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Resolve a project's triggers against changed repos
      tags:
      - projects
  /api/projects/{name}/run:
    post:
      consumes:
      - application/json
      description: Accepts the run and returns at once; the run executes in the background.
        Read the outcome from GET /api/projects/{name}/runs/{runID}.
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Run parameters
        in: body
        name: request
        schema:
          $ref: '#/definitions/web.runProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: project, run_id, status, and changed repos
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
