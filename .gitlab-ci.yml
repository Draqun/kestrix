stages:
  - analysis
  - test
  - build

default:
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache git gcc musl-dev

# ─── Analysis ───────────────────────────────────────────────

fmt-check:
  stage: analysis
  script:
    - test -z "$(gofmt -l .)" || (echo "Files need formatting:" && gofmt -l . && exit 1)
    - echo "✓ Formatting OK"

vet:
  stage: analysis
  script:
    - go vet ./...

staticcheck:
  stage: analysis
  before_script:
    - apk add --no-cache git gcc musl-dev
    - go install honnef.co/go/tools/cmd/staticcheck@latest
  script:
    - staticcheck ./...

# ─── Test ───────────────────────────────────────────────────

test:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: metaci
    POSTGRES_PASSWORD: metaci
    POSTGRES_DB: metaci_test
    METACI_TEST_DATABASE_URL: postgres://metaci:metaci@postgres:5432/metaci_test?sslmode=disable
  # bash is needed for internal/runner tests that shell out via `bash -c`.
  # golang:1.25-alpine ships busybox sh only — install explicit bash
  # because the runner tests skip when bash is unavailable.
  before_script:
    - apk add --no-cache bash
  script:
    - make test
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+%)/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 7 days

test_fe:
  stage: test
  image: node:26-alpine
  before_script:
    - cd ui && npm ci --silent
  script:
    - cd ui && node --test --experimental-test-coverage src/components/Pagination.test.js src/lib/runFilters.test.js
  coverage: '/coverage:\s+(\d+\.\d+)%/'

# ─── Build ──────────────────────────────────────────────────

build:
  stage: build
  script:
    - go build -ldflags="-s -w" -o kestrix ./cmd/kestrix
  artifacts:
    paths:
      - kestrix
    expire_in: 30 days
