stages:
  - analysis
  - test
  - build
  - release

default:
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache git gcc musl-dev

# ─── Which pipelines exist ──────────────────────────────────
# One pipeline per commit. A branch with an open merge request gets only
# its merge request pipeline; without this, every push to such a branch
# ran the whole suite twice (branch + MR) on the same two runners, which
# queued the MR pipeline and timed `test_fe` out. main, other branches and
# release tags keep their normal pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ─── Change-based job rules ─────────────────────────────────
# Every job below only runs when a file it actually depends on changed.
# A docs/openspec/wiki-only change matches neither list, so no job runs and
# no pipeline is created at all - nothing left to skip. In a merge request
# pipeline `changes:` compares against the target branch, so this holds
# from the first push; a brand-new branch pushed with no MR yet has no base
# to compare with and runs every job once.
# .gitlab-ci.yml itself is always included so editing the pipeline is
# validated by its own run.
#
# A `vX.Y.Z` tag always matches too, regardless of which files the tagged
# commit itself changed (scripts/release.sh's release commit only ever
# touches CHANGELOG.md) - otherwise the release stage's `needs: ...
# optional: true` on these jobs would silently gate on nothing and publish
# an unverified build.

.go-job-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - changes:
        - "**/*.go"
        - "go.mod"
        - "go.sum"
        - "Makefile"
        - "scripts/**/*"
        - ".gitlab-ci.yml"

.fe-job-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - changes:
        - "ui/**/*"
        - "scripts/**/*"
        - ".gitlab-ci.yml"

# ─── Analysis ───────────────────────────────────────────────

fmt-check:
  extends: .go-job-rules
  stage: analysis
  script:
    - test -z "$(gofmt -l .)" || (echo "Files need formatting:" && gofmt -l . && exit 1)
    - echo "✓ Formatting OK"

vet:
  extends: .go-job-rules
  stage: analysis
  script:
    - go vet ./...

staticcheck:
  extends: .go-job-rules
  stage: analysis
  # The Makefile owns the pinned staticcheck version so CI and local runs
  # cannot drift apart.
  before_script:
    - apk add --no-cache bash git make gcc musl-dev
  script:
    - make staticcheck

# ─── Test ───────────────────────────────────────────────────

runner-unit-coverage:
  extends: .go-job-rules
  stage: test
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache bash make gcc musl-dev
  script:
    - make runner-unit-coverage
  coverage: '/total:\s+\(statements\)\s+(100\.0%)/'
  artifacts:
    paths:
      - coverage/runner-unit.out
      - coverage/runner-unit-summary.txt
    expire_in: 7 days

test:
  extends: .go-job-rules
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: kestrix
    POSTGRES_PASSWORD: kestrix
    POSTGRES_DB: kestrix_test
    KESTRIX_TEST_DATABASE_URL: postgres://kestrix:kestrix@postgres:5432/kestrix_test?sslmode=disable
  # bash is needed for internal/runner tests that shell out via `bash -c`.
  # golang:1.25-alpine ships busybox sh only — install explicit bash
  # because the runner tests skip when bash is unavailable.
  before_script:
    - apk add --no-cache bash git make gcc musl-dev
    - export CGO_ENABLED=1
  script:
    - make test
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+%)/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 7 days

test_fe:
  extends: .fe-job-rules
  stage: test
  image: node:26-alpine
  before_script:
    - cd ui && npm ci --silent
  # `npm test` (node --test, then `npm run test:coverage`) is the same command
  # `make ui-test` runs locally, so CI enforces exactly what's enforced on a
  # dev machine. test:coverage's thresholds (ui/vitest.coverage.config.js) are
  # a floor raised by hand whenever coverage clears it with room to spare, and
  # vitest exits non-zero on a drop below it - so this job now fails on a
  # coverage regression instead of only printing an unrelated number. The
  # previous two-line script (node --test --experimental-test-coverage, then
  # test:components without thresholds) never ran test:coverage at all, so a
  # drop below the committed floor passed silently; its coverage regex also
  # tracked node's own report over just src/api and src/lib, which swung with
  # files like client.js/normalizers.js that were never in scope of the
  # thresholds and unrelated to whatever change triggered the pipeline.
  script:
    - npm test
  coverage: '/Statements\s*:\s*(\d+\.\d+%)/'

runner-integration:
  extends: .go-job-rules
  stage: test
  image: golang:1.25-alpine
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash docker-cli make gcc musl-dev
  script:
    - make runner-integration

web-e2e:
  extends: .go-job-rules
  stage: test
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache bash git make gcc musl-dev
  script:
    - make web-e2e

shell-tests:
  extends: .go-job-rules
  stage: test
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache bash git coreutils
  script:
    - bash scripts/test-shell.sh

# ─── Build ──────────────────────────────────────────────────

build:
  extends: .go-job-rules
  stage: build
  script:
    - go build -ldflags="-s -w" -o kestrix ./cmd/kestrix
  artifacts:
    paths:
      - kestrix
    expire_in: 30 days

# ─── Release ────────────────────────────────────────────────
# Runs only on a `vX.Y.Z` tag, after every analysis/test/build job that
# was scheduled for this pipeline has passed. `optional: true` lets a job
# that a change-based rule excluded from this specific pipeline be absent
# without blocking release job creation - it still blocks on any of them
# that did run.

.release-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

.release-needs:
  needs:
    - job: fmt-check
      optional: true
    - job: vet
      optional: true
    - job: staticcheck
      optional: true
    - job: runner-unit-coverage
      optional: true
    - job: test
      optional: true
    - job: test_fe
      optional: true
    - job: runner-integration
      optional: true
    - job: web-e2e
      optional: true
    - job: shell-tests
      optional: true
    - job: build
      optional: true

publish-image:
  extends: [.release-rules, .release-needs]
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GIT_DEPTH: 0
  retry: 1
  before_script:
    - apk add --no-cache bash git coreutils
  script:
    - DOCKER_IMAGE="$CI_REGISTRY_IMAGE" DOCKER_TAG="$CI_COMMIT_TAG" bash scripts/docker-build.sh
    - |
      skip_latest=""
      bash scripts/is-latest-tag.sh "$CI_COMMIT_TAG" || skip_latest=1
      if [ -n "$skip_latest" ]; then
        echo "publish-image: $CI_COMMIT_TAG is not the newest release tag - skipping :latest"
      fi
      DOCKER_IMAGE="$CI_REGISTRY_IMAGE" DOCKER_TAG="$CI_COMMIT_TAG" DOCKER_REGISTRY="$CI_REGISTRY" DOCKER_USERNAME="$CI_REGISTRY_USER" DOCKER_PASSWORD="$CI_REGISTRY_PASSWORD" SKIP_LATEST="$skip_latest" bash scripts/docker-push.sh

release-binary:
  extends: [.release-rules, .release-needs]
  stage: release
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache git gcc musl-dev curl
  script:
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$(sh scripts/ldflags.sh $CI_COMMIT_TAG)" -o kestrix ./cmd/kestrix
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file kestrix "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kestrix/${CI_COMMIT_TAG}/kestrix"'
  artifacts:
    paths:
      - kestrix
    expire_in: 7 days

create-release:
  extends: .release-rules
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release-binary
      artifacts: false
    - job: publish-image
      artifacts: false
  before_script:
    - apk add --no-cache bash
  script:
    - bash scripts/changelog-section.sh "$CI_COMMIT_TAG" > release-notes.md
    - >
      release-cli create --tag-name "$CI_COMMIT_TAG"
      --description release-notes.md
      --assets-link "{\"name\":\"kestrix (linux/amd64)\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kestrix/${CI_COMMIT_TAG}/kestrix\"}"

# ─── GitLab Pages ───────────────────────────────────────────

pages:
  stage: release
  image: python:3.13-alpine
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - apk add --no-cache bash
    - pip install --no-cache-dir markdown
  script:
    - bash scripts/build-docs.sh docs public
  artifacts:
    paths:
      - public
    expire_in: 30 days
