# ─────────────────────────────────────────────────────────────
# Kestrix — Local development environment
# ─────────────────────────────────────────────────────────────
#
# Usage:
#   docker compose up          # start in foreground
#   docker compose up -d       # start in background
#   docker compose down        # stop and remove
#   docker compose logs -f     # follow logs
#   docker compose rebuild     # rebuild images
#
name: kestrix-dev

services:
  # ─── Kestrix server ───────────────────────────────────────
  kestrix:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: kestrix-dev-app
    ports:
      - "${KESTRIX_PORT:-8080}:8080"
    volumes:
      # Mount the complete checkout so local pipeline definitions and task
      # scripts are available to the runner as well as to the hot reloader.
      - ..:/app
      - ${KESTRIX_MASTER_KEY_PATH:?Set KESTRIX_MASTER_KEY_PATH to a mode-0600 master-key file}:${KESTRIX_MASTER_KEY_PATH}:ro
      - ${KESTRIX_JWT_SIGNING_KEY_PATH:?Set KESTRIX_JWT_SIGNING_KEY_PATH to a mode-0600 signing-key file}:${KESTRIX_JWT_SIGNING_KEY_PATH}:ro
      # Allow the local pipeline's docker_build task to build sibling images.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - KESTRIX_WEBHOOK_SECRET=${KESTRIX_WEBHOOK_SECRET:-dev-secret}
      - KESTRIX_MASTER_KEY_PATH=${KESTRIX_MASTER_KEY_PATH}
      - KESTRIX_JWT_SIGNING_KEY_PATH=${KESTRIX_JWT_SIGNING_KEY_PATH}
      - KESTRIX_WEBHOOK_HISTORY_LIMIT=${KESTRIX_WEBHOOK_HISTORY_LIMIT:-1000}
      - KESTRIX_GITLAB_URL=${KESTRIX_GITLAB_URL:-https://gitlab.com}
      - KESTRIX_GITLAB_TOKEN=${KESTRIX_GITLAB_TOKEN:-}
      - KESTRIX_DISPATCH_PROJECT=${KESTRIX_DISPATCH_PROJECT:-}
      - DATABASE_URL=postgres://kestrix:kestrix@postgres:5432/kestrix_local?sslmode=disable
      - DOCKER_REGISTRY=${DOCKER_REGISTRY:-}
      - DOCKER_IMAGE=${DOCKER_IMAGE:-kestrix}
      - DOCKER_USERNAME=${DOCKER_USERNAME:-}
      - DOCKER_PASSWORD=${DOCKER_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── PostgreSQL (for future webhook log storage) ──────────
  postgres:
    image: postgres:16-alpine
    container_name: kestrix-dev-postgres
    environment:
      POSTGRES_DB: kestrix_local
      POSTGRES_USER: kestrix
      POSTGRES_PASSWORD: kestrix
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      # Create the test database on first init (runs only when volume is empty)
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrix"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Redis (for future rate limiting / caching) ───────────
  redis:
    image: redis:7-alpine
    container_name: kestrix-dev-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  local_postgres_data:
    name: kestrix_local_postgres_data
  redis_data:
