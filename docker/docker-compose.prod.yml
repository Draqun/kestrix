# ─────────────────────────────────────────────────────────────
# Kestrix — Production deployment
# ─────────────────────────────────────────────────────────────
#
# Usage:
#   KESTRIX_IMAGE=kestrix:latest docker compose -f docker-compose.prod.yml up -d
#
services:
  kestrix:
    image: ${KESTRIX_IMAGE:-kestrix:latest}
    ports:
      - "${KESTRIX_PORT:-18080}:8080"
    environment:
      - DATABASE_URL=postgres://kestrix:kestrix@postgres:5432/kestrix?sslmode=disable
      - KESTRIX_WEBHOOK_SECRET=${KESTRIX_WEBHOOK_SECRET:-dev-secret}
      - KESTRIX_GITLAB_URL=${KESTRIX_GITLAB_URL:-https://gitlab.com}
      - KESTRIX_GITLAB_TOKEN=${KESTRIX_GITLAB_TOKEN:-}
      - KESTRIX_DISPATCH_PROJECT=${KESTRIX_DISPATCH_PROJECT:-}
      - KESTRIX_SOURCE_CACHE_DIR=/var/lib/kestrix/cache/git
      - KESTRIX_SOURCE_CACHE_MAX_AGE=${KESTRIX_SOURCE_CACHE_MAX_AGE:-720h}
      - KESTRIX_SOURCE_CACHE_MAX_BYTES=${KESTRIX_SOURCE_CACHE_MAX_BYTES:-10737418240}
      - DOCKER_REGISTRY=${DOCKER_REGISTRY:-}
      - DOCKER_IMAGE=${DOCKER_IMAGE:-kestrix}
      - DOCKER_USERNAME=${DOCKER_USERNAME:-}
      - DOCKER_PASSWORD=${DOCKER_PASSWORD:-}
    volumes:
      - source_cache:/var/lib/kestrix/cache/git
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  business:
    image: nginx:1.27-alpine
    ports:
      - "${BUSINESS_BIND_HOST:-127.0.0.1}:${BUSINESS_PORT:-8082}:80"
    volumes:
      - ../ui/dist/business:/usr/share/nginx/html:ro
      - ./business-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kestrix
      POSTGRES_USER: kestrix
      POSTGRES_PASSWORD: kestrix
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrix"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  source_cache:
