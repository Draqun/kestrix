# ─────────────────────────────────────────────────────────────
# Kestrix — Production deployment
# ─────────────────────────────────────────────────────────────
#
# Usage:
#   KESTRIX_IMAGE=kestrix:latest KESTRIX_MASTER_KEY_PATH=/srv/kestrix/master.key \
#     KESTRIX_JWT_SIGNING_KEY_PATH=/srv/kestrix/jwt.key \
#     docker compose -f docker-compose.prod.yml up -d
#
# Kestrix serves no request until an administrator account exists:
#   docker compose -f docker-compose.prod.yml exec kestrix \
#     kestrix user create --role admin <name>
#
services:
  kestrix:
    image: ${KESTRIX_IMAGE:-kestrix:latest}
    ports:
      - "${KESTRIX_PORT:-18080}:8080"
    environment:
      - DATABASE_URL=postgres://kestrix:kestrix@postgres:5432/kestrix?sslmode=disable
      # BREAKING: no default secret. Deliveries to /webhook are refused with
      # 401 until KESTRIX_WEBHOOK_SECRET or a per-project secret is set; see
      # design.md D5/Migration Plan in webhook-ingress-hardening.
      - KESTRIX_WEBHOOK_SECRET=${KESTRIX_WEBHOOK_SECRET:-}
      - KESTRIX_MASTER_KEY_PATH=${KESTRIX_MASTER_KEY_PATH}
      - KESTRIX_JWT_SIGNING_KEY_PATH=${KESTRIX_JWT_SIGNING_KEY_PATH}
      - KESTRIX_IDENTITY_CACHE_TTL=${KESTRIX_IDENTITY_CACHE_TTL:-}
      - KESTRIX_LOGIN_MAX_ATTEMPTS=${KESTRIX_LOGIN_MAX_ATTEMPTS:-}
      - KESTRIX_LOGIN_WINDOW=${KESTRIX_LOGIN_WINDOW:-}
      - KESTRIX_TRUST_PROXY_HEADER=${KESTRIX_TRUST_PROXY_HEADER:-}
      - KESTRIX_CONTENT_SECURITY_POLICY=${KESTRIX_CONTENT_SECURITY_POLICY:-}
      - KESTRIX_COOKIE_SECURE=${KESTRIX_COOKIE_SECURE:-}
      - KESTRIX_HTTP_READ_TIMEOUT=${KESTRIX_HTTP_READ_TIMEOUT:-}
      - KESTRIX_HTTP_WRITE_TIMEOUT=${KESTRIX_HTTP_WRITE_TIMEOUT:-}
      - KESTRIX_HTTP_IDLE_TIMEOUT=${KESTRIX_HTTP_IDLE_TIMEOUT:-}
      - KESTRIX_HTTP_MAX_BODY_BYTES=${KESTRIX_HTTP_MAX_BODY_BYTES:-}
      - KESTRIX_WEBHOOK_MAX_BODY_BYTES=${KESTRIX_WEBHOOK_MAX_BODY_BYTES:-}
      - KESTRIX_WEBHOOK_HISTORY_LIMIT=${KESTRIX_WEBHOOK_HISTORY_LIMIT:-1000}
      - KESTRIX_GITLAB_URL=${KESTRIX_GITLAB_URL:-https://gitlab.com}
      - KESTRIX_GITLAB_TOKEN=${KESTRIX_GITLAB_TOKEN:-}
      - KESTRIX_DISPATCH_PROJECT=${KESTRIX_DISPATCH_PROJECT:-}
      - KESTRIX_SOURCE_CACHE_DIR=/var/lib/kestrix/cache/git
      - KESTRIX_SOURCE_CACHE_MAX_AGE=${KESTRIX_SOURCE_CACHE_MAX_AGE:-720h}
      - KESTRIX_SOURCE_CACHE_MAX_BYTES=${KESTRIX_SOURCE_CACHE_MAX_BYTES:-10737418240}
      - DOCKER_REGISTRY=${DOCKER_REGISTRY:-}
      - DOCKER_IMAGE=${DOCKER_IMAGE:-kestrix}
      - DOCKER_USERNAME=${DOCKER_USERNAME:-}
      - DOCKER_PASSWORD=${DOCKER_PASSWORD:-}
      - DEPLOY_HOST=${DEPLOY_HOST:-}
      - KESTRIX_TEST_DATABASE_URL=${KESTRIX_TEST_DATABASE_URL:-}
      # Task execution isolation (BREAKING): task processes no longer
      # inherit this container's environment. The dogfood pipeline's own
      # scripts read these host variables, so they are passed through
      # explicitly; see .env.template and design.md D2.
      - KESTRIX_RUNNER_ENV_PASSTHROUGH=${KESTRIX_RUNNER_ENV_PASSTHROUGH:-DOCKER_REGISTRY,DOCKER_IMAGE,DOCKER_USERNAME,DOCKER_PASSWORD,DEPLOY_HOST,KESTRIX_TEST_DATABASE_URL}
      - KESTRIX_RUNNER_DOCKER_PIDS=${KESTRIX_RUNNER_DOCKER_PIDS:-}
      - KESTRIX_RUNNER_DOCKER_MEMORY=${KESTRIX_RUNNER_DOCKER_MEMORY:-}
      - KESTRIX_RUNNER_DOCKER_CPUS=${KESTRIX_RUNNER_DOCKER_CPUS:-}
      - KESTRIX_RUNNER_DOCKER_USER=${KESTRIX_RUNNER_DOCKER_USER:-}
      - KESTRIX_RUNNER_DOCKER_NETWORK=${KESTRIX_RUNNER_DOCKER_NETWORK:-}
      - KESTRIX_RUNNER_CANCEL_GRACE=${KESTRIX_RUNNER_CANCEL_GRACE:-}
    volumes:
      - ${KESTRIX_MASTER_KEY_PATH:?Set KESTRIX_MASTER_KEY_PATH to a mode-0600 master-key file}:${KESTRIX_MASTER_KEY_PATH}:ro
      - ${KESTRIX_JWT_SIGNING_KEY_PATH:?Set KESTRIX_JWT_SIGNING_KEY_PATH to a mode-0600 signing-key file}:${KESTRIX_JWT_SIGNING_KEY_PATH}:ro
      - source_cache:/var/lib/kestrix/cache/git
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  business:
    image: nginx:1.27-alpine
    ports:
      - "${BUSINESS_BIND_HOST:-127.0.0.1}:${BUSINESS_PORT:-8082}:80"
    volumes:
      - ../ui/dist/business:/usr/share/nginx/html:ro
      - ./business-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kestrix
      POSTGRES_USER: kestrix
      POSTGRES_PASSWORD: kestrix
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrix"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  source_cache:
