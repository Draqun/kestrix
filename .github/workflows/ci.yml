name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: |
          go test ./internal/dag/... ./internal/dispatch/... ./internal/model/... ./internal/parser/... ./internal/variables/... -v
