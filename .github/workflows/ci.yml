name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changelog-check:
    name: Check changelog fragment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify changelog fragment
        run: |
          git fetch origin ${{ github.base_ref }}
          python3 scripts/verify_changelog.py --target-ref origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: |
          go test ./internal/dag/... ./internal/dispatch/... ./internal/model/... ./internal/parser/... ./internal/variables/... -v
